# PickArr — example compose (linux/amd64)
# Prefer a local bind mount or named volume for /config (SQLite WAL).
# Avoid network filesystems (SMB/NFS) for the data directory.

services:
  pickarr:
    image: pickarr:local
    # For GitLab registry builds, e.g.:
    # image: registry.gitlab.com/<namespace>/<project>:latest
    build:
      context: .
      dockerfile: src/PickArr.Api/Dockerfile
    container_name: pickarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Rome
      - ASPNETCORE_URLS=http://+:8080
      - PickArr__DataPath=/config
      - PickArr__BaseUrl=http://localhost:8080
    volumes:
      - pickarr-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pickarr-config:
