# PickArr — example compose (linux/amd64)
# Prefer a local bind mount or named volume for /config (SQLite WAL).
# Avoid network filesystems (SMB/NFS) for the data directory.
# The image defaults ASPNETCORE_URLS=http://+:8080 and PickArr__DataPath=/config.

services:
  pickarr:
    image: pickarr:local
    # Published GHCR tags: edge and X.Y.Z.N (default branch), X.Y.Z and latest (tag vX.Y.Z).
    # image: ghcr.io/<owner>/<repo>:edge
    build:
      context: .
      dockerfile: src/PickArr.Api/Dockerfile
    container_name: pickarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Rome
      - PickArr__BaseUrl=http://localhost:8080
      # Application settings (flat names). Non-empty values override the database.
      # - WATCHMODE_API_KEY=
      # - TMDB_TOKEN=
      # - SONARR_URL=http://sonarr:8989
      # - SONARR_API_KEY=
      # - RADARR_URL=http://radarr:7878
      # - RADARR_API_KEY=
    volumes:
      - pickarr-config:/config
    healthcheck:
      test: ["CMD", "/usr/local/bin/wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pickarr-config:
