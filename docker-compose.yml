# PickArr — example compose (linux/amd64)
# Prefer a local bind mount or named volume for /config (SQLite WAL).
# Avoid network filesystems (SMB/NFS) for the data directory.

services:
  pickarr:
    image: pickarr:local
    # Published GHCR tags: edge and X.Y.Z.N (default branch), X.Y.Z and latest (tag vX.Y.Z).
    # image: ghcr.io/<owner>/<repo>:edge
    build:
      context: .
      dockerfile: src/PickArr.Api/Dockerfile
    container_name: pickarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Rome
      - ASPNETCORE_URLS=http://+:8080
      - PickArr__DataPath=/config
      - PickArr__BaseUrl=http://localhost:8080
      # Impostazioni applicative: vincono sul database. I punti della chiave diventano __.
      # - PickArr__Settings__watchmode__apiKey=
      # - PickArr__Settings__tmdb__token=
      # - PickArr__Settings__sonarr__url=http://sonarr:8989
      # - PickArr__Settings__sonarr__apiKey=
      # - PickArr__Settings__radarr__url=http://radarr:7878
      # - PickArr__Settings__radarr__apiKey=
    volumes:
      - pickarr-config:/config
    healthcheck:
      test: ["CMD", "/usr/local/bin/wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pickarr-config:
