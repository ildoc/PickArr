# Lint and test on pull requests, pushes to the default branch, and tags.
# The image is built on those events and pushed to GHCR only from the default
# branch and from tags. A tag vX.Y.Z (or X.Y.Z) sets the version to X.Y.Z and
# is published as X.Y.Z and latest. Later builds use X.Y.Z.N, where N is the
# number of commits after that tag, and the default branch is also tagged edge.
name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore PickArr.slnx

      - name: Verify formatting
        run: dotnet format PickArr.slnx --verify-no-changes --no-restore

      # Informational. Restore already enforces NuGetAuditMode=direct.
      - name: Report vulnerable packages
        continue-on-error: true
        run: dotnet list PickArr.slnx package --vulnerable --include-transitive

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/PickArr.WebApp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/PickArr.WebApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  backend-test:
    name: Backend test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Test
        run: dotnet test PickArr.slnx --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 14
          if-no-files-found: ignore

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/PickArr.WebApp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/PickArr.WebApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Image
    needs: [backend-lint, frontend-lint, backend-test, frontend-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Image version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          base=""
          distance=""
          while IFS= read -r name; do
            case "$name" in
              v*) stripped="${name#v}" ;;
              *) stripped="$name" ;;
            esac
            if [[ ! "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if ! git merge-base --is-ancestor "refs/tags/$name" HEAD; then
              continue
            fi
            count="$(git rev-list --count "refs/tags/$name..HEAD")"
            if [ -z "$base" ] || [ "$count" -lt "$distance" ]; then
              base="$stripped"
              distance="$count"
            elif [ "$count" -eq "$distance" ]; then
              base="$(printf '%s\n%s\n' "$base" "$stripped" | sort -V | tail -n 1)"
            fi
          done < <(git for-each-ref --format='%(refname:short)' 'refs/tags')

          if [ -z "$base" ]; then
            base="0.0.0"
            distance="$(git rev-list --count HEAD)"
          fi

          release=false
          if [ "$REF_TYPE" = "tag" ]; then
            tagged="${REF_NAME#v}"
            if [[ "$tagged" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              base="$tagged"
              distance=0
              release=true
            fi
          fi

          if [ "$distance" -eq 0 ]; then
            version="$base"
          else
            version="${base}.${distance}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Image version ${version} (release=${release})"

      - name: Decide whether to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          publish=false
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" = "tag" ] || [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
              publish=true
            fi
          fi
          echo "push=${publish}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/PickArr.Api/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: true
          sbom: true
